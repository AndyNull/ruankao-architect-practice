name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare runtime files
        run: |
          mkdir -p _site/data/banks
          cp index.html styles.css .nojekyll _site/
          cp -r src _site/
          cp data/bank.json data/figures.json data/ai-explanations.json data/ai-case-explanations.json data/study-materials.json _site/data/
          cp -r data/study-materials _site/data/
          cp data/banks/index.json data/banks/coverage.json _site/data/banks/
          for subject in planner itpm analyst network; do
            cp "data/banks/$subject.json" "data/banks/ai-explanations-$subject.json" "data/banks/ai-case-explanations-$subject.json" _site/data/banks/
          done
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
